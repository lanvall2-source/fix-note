<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Glowing Emblem -->
  <g filter="url(#glow)">
    <!-- Shield / Note shape -->
    <path d="M160 140 C160 130 170 120 180 120 L332 120 C342 120 352 130 352 140 L352 320 C352 380 256 420 256 420 C256 420 160 380 160 320 Z" 
          fill="url(#accentGrad)" opacity="0.9" />

    <!-- Sparkle / Star in Center -->
    <path d="M256 180 L266 226 L312 236 L266 246 L256 292 L246 246 L200 236 L246 226 Z" 
          fill="#ffffff" />

    <!-- Horizontal Note lines -->
    <rect x="216" y="310" width="80" height="12" rx="6" fill="#ffffff" opacity="0.9"/>
    <rect x="236" y="336" width="40" height="10" rx="5" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
